name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes "Daemonitor ${TAG_NAME}"

  build-cli-asset:
    name: Build CLI archive (${{ matrix.platform }}-${{ matrix.arch }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            goos: linux
            goarch: amd64
            extra_arch: arm64
            extra_goarch: arm64
            extra_label: linux-arm64
          - os: macos-latest
            platform: macos
            arch: arm64
            goos: darwin
            goarch: arm64
            extra_arch: x64
            extra_goarch: amd64
            extra_label: macos-x64
          - os: windows-latest
            platform: windows
            arch: x64
            goos: windows
            goarch: amd64
            extra_arch: ""
            extra_goarch: ""
            extra_label: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cored/go.mod
          cache-dependency-path: cored/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test CLI
        run: ./gradlew :cli:test :cli:distZip --no-daemon --stacktrace

      - name: Stage CLI release archive(s)
        id: stage
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(cli/build/distributions/*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected one CLI archive, found ${#archives[@]}" >&2
            exit 1
          fi
          version=$(./gradlew -q printNativePackageVersion --no-daemon)
          mkdir -p cli-release
          primary="daemonitor-cli-${version}-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          cp "${archives[0]}" "cli-release/${primary}"
          listing=$(unzip -l "cli-release/${primary}")
          if ! grep -E 'daemonitor-cored(\.exe)?$' <<< "$listing"; then
            echo "Release CLI archive missing daemonitor-cored binary" >&2
            exit 1
          fi
          echo "### Standalone CLI (${{ matrix.platform }}-${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive: ${primary}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Includes: host-arch daemonitor-cored" >> "$GITHUB_STEP_SUMMARY"

          extra_label="${{ matrix.extra_label }}"
          if [[ -n "$extra_label" ]]; then
            work=$(mktemp -d)
            unzip -q "cli-release/${primary}" -d "$work"
            root=$(find "$work" -mindepth 1 -maxdepth 1 -type d | head -1)
            bin_dir="$root/bin"
            cored_name=daemonitor-cored
            if [[ "${{ matrix.platform }}" == "windows" ]]; then
              cored_name=daemonitor-cored.exe
            fi
            CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.extra_goarch }}" \
              go build -trimpath -ldflags="-s -w" \
              -o "$bin_dir/$cored_name" \
              ./cored/cmd/daemonitor-cored
            chmod +x "$bin_dir/$cored_name" 2>/dev/null || true
            extra="daemonitor-cli-${version}-${extra_label}.zip"
            (cd "$work" && zip -qry "$GITHUB_WORKSPACE/cli-release/${extra}" "$(basename "$root")")
            echo "- Extra archive: ${extra} (cored ${{ matrix.goos }}/${{ matrix.extra_goarch }})" >> "$GITHUB_STEP_SUMMARY"
            rm -rf "$work"
          fi

      - name: Upload CLI release asset
        uses: actions/upload-artifact@v4
        with:
          name: standalone-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: cli-release/daemonitor-cli-*.zip
          if-no-files-found: error
          retention-days: 7

  build-cored-cross:
    name: Cross-compile daemonitor-cored
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cored/go.mod
          cache-dependency-path: cored/go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cross-compile cored matrix
        run: |
          set -euo pipefail
          version=$(./gradlew -q printNativePackageVersion --no-daemon)
          out="cored-release"
          mkdir -p "$out"
          cored/scripts/cross-compile-cored.sh "$out/raw"
          for f in "$out"/raw/*; do
            base=$(basename "$f")
            # daemonitor-cored-darwin-arm64 → daemonitor-cored-VERSION-darwin-arm64
            renamed=$(echo "$base" | sed "s/^daemonitor-cored-/daemonitor-cored-${version}-/")
            cp "$f" "$out/$renamed"
          done
          rm -rf "$out/raw"
          ls -la "$out"
          echo "### Cross-compiled daemonitor-cored" >> "$GITHUB_STEP_SUMMARY"
          for f in "$out"/*; do
            echo "- $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload cored cross artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daemonitor-cored-cross
          path: cored-release/*
          if-no-files-found: error
          retention-days: 7

  build-assets:
    name: Build release asset (${{ matrix.os }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            package_task: packageDeb
            package_glob: build/compose/binaries/main/deb/*.deb
            package_ext: deb
            update_ext: tar.gz
            launcher: build/compose/binaries/main/app/Daemonitor/bin/Daemonitor
            app_path: build/compose/binaries/main/app/Daemonitor
          - os: windows-latest
            platform: windows
            package_task: packageMsi
            package_glob: build/compose/binaries/main/msi/*.msi
            package_ext: msi
            update_ext: zip
            launcher: build/compose/binaries/main/app/Daemonitor/Daemonitor.exe
            app_path: build/compose/binaries/main/app/Daemonitor
          - os: macos-latest
            platform: macos
            package_task: packageDmg
            package_glob: build/compose/binaries/main/dmg/*.dmg
            package_ext: dmg
            update_ext: zip
            launcher: build/compose/binaries/main/app/Daemonitor.app/Contents/MacOS/Daemonitor
            app_path: build/compose/binaries/main/app/Daemonitor.app
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cored/go.mod
          cache-dependency-path: cored/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew test --no-daemon --stacktrace

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build native application and installer
        run: ./gradlew createDistributable ${{ matrix.package_task }} --no-daemon --stacktrace

      - name: Smoke test packaged launcher
        run: |
          output=$("${{ matrix.launcher }}" --headless --help)
          printf '%s\n' "$output"
          [[ "$output" == *"Usage: daemonitor --headless"* ]]

      - name: Verify bundled daemonitor-cored in app resources
        run: |
          set -euo pipefail
          cored=$(find build/compose/binaries/main/app -type f \( -name 'daemonitor-cored' -o -name 'daemonitor-cored.exe' \) | head -1)
          if [[ -z "$cored" ]]; then
            echo "Packaged app missing daemonitor-cored under app/" >&2
            find build/compose/binaries/main/app -type f | head -80 >&2 || true
            exit 1
          fi
          case "$cored" in
            */resources/daemonitor-cored|*/resources/daemonitor-cored.exe) ;;
            *)
              echo "Bundled cored not under resources/: $cored" >&2
              exit 1
              ;;
          esac
          echo "Bundled cored: $cored"
          echo "- Desktop bundle includes daemonitor-cored" >> "$GITHUB_STEP_SUMMARY"

      - name: Read package version
        id: package-version
        run: echo "value=$(./gradlew -q printNativePackageVersion --no-daemon)" >> "$GITHUB_OUTPUT"

      - name: Detect CPU architecture
        id: arch
        run: |
          machine=$(uname -m | tr '[:upper:]' '[:lower:]')
          case "$machine" in
            arm64|aarch64) arch=arm64 ;;
            x86_64|amd64) arch=x64 ;;
            *)
              echo "Unsupported architecture: $machine" >&2
              exit 1
              ;;
          esac
          echo "value=$arch" >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        id: asset
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(${{ matrix.package_glob }})
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one native installer, found ${#packages[@]}" >&2
            exit 1
          fi
          test -s "${packages[0]}"
          test -e "${{ matrix.app_path }}"

          version="${{ steps.package-version.outputs.value }}"
          platform="${{ matrix.platform }}"
          arch="${{ steps.arch.outputs.value }}"
          mkdir -p release-assets

          installer="Daemonitor-${version}-${platform}-${arch}.${{ matrix.package_ext }}"
          cp "${packages[0]}" "release-assets/${installer}"

          update_asset="Daemonitor-${version}-${platform}-${arch}.${{ matrix.update_ext }}"
          app_dir="$(dirname "${{ matrix.app_path }}")"
          app_name="$(basename "${{ matrix.app_path }}")"
          update_path="$GITHUB_WORKSPACE/release-assets/${update_asset}"
          case "${{ matrix.update_ext }}" in
            zip)
              if command -v zip >/dev/null 2>&1; then
                (cd "$app_dir" && zip -qry "$update_path" "$app_name")
              else
                powershell.exe -NoProfile -Command \
                  "Compress-Archive -Path (Join-Path '$app_dir' '$app_name') -DestinationPath '$update_path' -Force"
              fi
              ;;
            tar.gz)
              (cd "$app_dir" && tar -czf "$update_path" "$app_name")
              ;;
            *)
              echo "Unsupported update extension: ${{ matrix.update_ext }}" >&2
              exit 1
              ;;
          esac
          test -s "release-assets/${update_asset}"

          {
            echo "installer=${installer}"
            echo "update=${update_asset}"
          } >> "$GITHUB_OUTPUT"
          echo "### Release assets" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: ${platform}/${arch}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installer: ${installer}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Update package: ${update_asset}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staged release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.platform }}-${{ steps.arch.outputs.value }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish-assets:
    name: Publish release assets and metadata
    needs:
      - build-assets
      - build-cli-asset
      - build-cored-cross
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download staged release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: release-assets
          merge-multiple: true

      - name: Download standalone CLI assets
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-cli-*
          path: cli-release
          merge-multiple: true

      - name: Download cored cross artifacts
        uses: actions/download-artifact@v4
        with:
          name: daemonitor-cored-cross
          path: cored-release

      - name: Read package version
        id: package-version
        run: echo "value=$(./gradlew -q printNativePackageVersion --no-daemon)" >> "$GITHUB_OUTPUT"

      - name: Generate release metadata
        run: |
          scripts/generate-release-metadata.sh \
            release-assets \
            release-metadata \
            "${{ steps.package-version.outputs.value }}" \
            "${{ github.ref_name }}" \
            "${{ github.repository }}"
          echo "### Release metadata" >> "$GITHUB_STEP_SUMMARY"
          echo "- latest.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- update.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- checksums.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "- per-asset .sha256 sidecars" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets and metadata to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" \
            release-assets/* \
            cli-release/* \
            cored-release/* \
            release-metadata/latest.json \
            release-metadata/update.json \
            release-metadata/checksums.txt \
            --clobber

  update-homebrew-tap:
    name: Update Homebrew tap formula
    needs: publish-assets
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check for Homebrew tap deploy key
        id: tap-key
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          if [[ -z "${HOMEBREW_TAP_SSH_KEY}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_SSH_KEY not configured; skipping Homebrew tap update"
            echo "### Homebrew tap" >> "$GITHUB_STEP_SUMMARY"
            echo "- Skipped (add repository secret HOMEBREW_TAP_SSH_KEY: write deploy key for cdsap/homebrew-tap)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.tap-key.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.tap-key.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Download standalone CLI assets
        if: steps.tap-key.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-cli-*
          path: cli-release
          merge-multiple: true

      - name: Read package version
        if: steps.tap-key.outputs.available == 'true'
        id: package-version
        run: echo "value=$(./gradlew -q printNativePackageVersion --no-daemon)" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        if: steps.tap-key.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: cdsap/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          path: homebrew-tap

      - name: Bump daemonitor-cli formula
        if: steps.tap-key.outputs.available == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.package-version.outputs.value }}"
          scripts/update-homebrew-formula.sh \
            "$version" \
            homebrew-tap \
            "cli-release/daemonitor-cli-${version}-macos-arm64.zip" \
            "cli-release/daemonitor-cli-${version}-macos-x64.zip" \
            "cli-release/daemonitor-cli-${version}-linux-x64.zip"

      - name: Commit and push formula bump
        if: steps.tap-key.outputs.available == 'true'
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.package-version.outputs.value }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/daemonitor-cli.rb; then
            echo "Homebrew formula already up to date for v${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/daemonitor-cli.rb
          git commit -m "daemonitor-cli ${VERSION}"
          git push
          echo "### Homebrew tap" >> "$GITHUB_STEP_SUMMARY"
          echo "- Updated cdsap/homebrew-tap to daemonitor-cli ${VERSION} (multi-arch zips)" >> "$GITHUB_STEP_SUMMARY"
