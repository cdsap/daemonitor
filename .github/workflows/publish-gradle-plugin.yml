name: Publish Gradle plugin

# Manual / backfill path when a GitHub Release already exists (for example after
# wiring Plugin Portal publish onto an already-tagged product cut). Tag-triggered
# releases also publish via release.yml → publish-gradle-plugin.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish from (tag preferred, e.g. v1.2.4)"
        required: true
        type: string
        default: "v1.2.4"

permissions:
  contents: read

jobs:
  publish:
    name: Publish Gradle plugin to Plugin Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check publication credentials
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${GRADLE_PUBLISH_KEY}" ]]; then
            echo "::error::GRADLE_PUBLISH_KEY is not configured"
            exit 1
          fi
          if [[ -z "${GRADLE_PUBLISH_SECRET}" ]]; then
            echo "::error::GRADLE_PUBLISH_SECRET is not configured"
            exit 1
          fi

      - name: Reject SNAPSHOT plugin versions
        id: plugin-version
        run: |
          set -euo pipefail
          version="$(./gradlew -q :gradle-plugin:printGradlePluginVersion --no-daemon)"
          if [[ -z "$version" ]]; then
            echo "::error::Unable to determine the Gradle plugin version"
            exit 1
          fi
          case "$version" in
            *SNAPSHOT*|*snapshot*)
              echo "::error::Refusing to publish SNAPSHOT plugin version $version"
              exit 1
              ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing Gradle plugin version $version from ${{ inputs.ref }}"

      - name: Validate plugin publication
        run: ./gradlew :gradle-plugin:publishPlugins --validate-only --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Publish plugin
        run: ./gradlew :gradle-plugin:publishPlugins --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Summarize
        run: |
          echo "### Gradle plugin" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published io.github.cdsap.daemonitor ${{ steps.plugin-version.outputs.value }} from ${{ inputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
