name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-package:
    name: Package standalone CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build CLI distribution
        run: ./gradlew :cli:test :cli:distZip --no-daemon --stacktrace

      - name: Verify CLI archive excludes desktop runtime
        run: |
          archive=(cli/build/distributions/*.zip)
          if (( ${#archive[@]} != 1 )); then
            echo "Expected one CLI archive, found ${#archive[@]}" >&2
            exit 1
          fi
          listing=$(unzip -l "${archive[0]}")
          for forbidden in compose skiko swing; do
            if grep -Eiq "$forbidden" <<< "$listing"; then
              echo "Standalone CLI archive contains forbidden desktop runtime: $forbidden" >&2
              exit 1
            fi
          done
          echo "### Standalone CLI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive: ${archive[0]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: daemonitor-cli-${{ github.sha }}
          path: cli/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            package_task: packageDeb
            package_glob: build/compose/binaries/main/deb/*.deb
            launcher: build/compose/binaries/main/app/Daemonitor/bin/Daemonitor
            app_path: build/compose/binaries/main/app/Daemonitor
          - os: windows-latest
            platform: windows
            package_task: packageMsi
            package_glob: build/compose/binaries/main/msi/*.msi
            launcher: build/compose/binaries/main/app/Daemonitor/Daemonitor.exe
            app_path: build/compose/binaries/main/app/Daemonitor
          - os: macos-latest
            platform: macos
            package_task: packageDmg
            package_glob: build/compose/binaries/main/dmg/*.dmg
            launcher: build/compose/binaries/main/app/Daemonitor.app/Contents/MacOS/Daemonitor
            app_path: build/compose/binaries/main/app/Daemonitor.app
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Use bash everywhere so `./gradlew` (the shell wrapper) runs uniformly, including on
        # Windows (Git Bash ships on the runner). Xvfb steps are still guarded to Linux only.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compose Desktop UI tests render via Skia/AWT, which needs a display. macOS and Windows
      # runners provide one; Linux is headless, so wrap the run in a virtual framebuffer.
      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew test --no-daemon --stacktrace

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build native application and installer
        run: ./gradlew createDistributable ${{ matrix.package_task }} --no-daemon --stacktrace

      - name: Smoke test packaged launcher
        run: |
          ./scripts/smoke-test-native-distribution.sh \
            "${{ matrix.launcher }}" \
            "${{ matrix.app_path }}"

      - name: Read package version
        id: package-version
        run: echo "value=$(./gradlew -q printNativePackageVersion --no-daemon)" >> "$GITHUB_OUTPUT"

      - name: Verify native installer
        run: |
          shopt -s nullglob
          packages=(${{ matrix.package_glob }})
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one native installer, found ${#packages[@]}" >&2
            exit 1
          fi
          test -s "${packages[0]}"
          echo "### Native package" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: ${{ matrix.platform }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: ${packages[0]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native installer
        uses: actions/upload-artifact@v4
        with:
          name: Daemonitor-${{ steps.package-version.outputs.value }}-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.package_glob }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test
          if-no-files-found: ignore
