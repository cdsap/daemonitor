name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-package:
    name: Package standalone CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cored/go.mod
          cache-dependency-path: cored/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build CLI distribution
        run: ./gradlew :cli:test :cli:distZip buildDaemonitorGoCli stageNativeDaemonitorCli --no-daemon --stacktrace

      - name: Package native Go CLI zip
        run: |
          set -euo pipefail
          version=$(./gradlew -q printNativePackageVersion --no-daemon)
          ./cored/scripts/package-native-cli.sh "$version" linux x64 build/native-cli
          archive=(build/native-cli/daemonitor-cli-*.zip)
          if (( ${#archive[@]} != 1 )); then
            echo "Expected one native CLI archive, found ${#archive[@]}" >&2
            exit 1
          fi
          listing=$(unzip -l "${archive[0]}")
          if ! grep -E 'bin/daemonitor-cli$' <<< "$listing"; then
            echo "Native CLI archive missing daemonitor-cli" >&2
            exit 1
          fi
          if ! grep -E 'bin/daemonitor-cored$' <<< "$listing"; then
            echo "Native CLI archive missing daemonitor-cored" >&2
            exit 1
          fi
          if grep -Eiq 'openjdk|java\.exe|\.jar$' <<< "$listing"; then
            echo "Native CLI archive must not require a JDK" >&2
            exit 1
          fi

          # Regression check for cross-target packaging: the archive labels must
          # match the executable format, not only the filenames.
          review_dir=$(mktemp -d)
          ./cored/scripts/package-native-cli.sh "$version" windows arm64 "$review_dir"
          review_archive=("$review_dir"/daemonitor-cli-*.zip)
          unzip -q "${review_archive[0]}" -d "$review_dir/extracted"
          for executable in daemonitor-cli.exe daemonitor-cored.exe; do
            binary=$(find "$review_dir/extracted" -path "*/bin/$executable" -print -quit)
            format=$(file -b "$binary")
            if ! grep -Eiq '^PE32\+ executable.*(Aarch64|ARM64)' <<< "$format"; then
              echo "Expected Windows arm64 PE binary for $executable, got: $format" >&2
              exit 1
            fi
          done
          echo "### Native Go CLI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive: ${archive[0]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- JDK required: no" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Kotlin CLI archive excludes desktop runtime
        run: |
          archive=(cli/build/distributions/*.zip)
          if (( ${#archive[@]} != 1 )); then
            echo "Expected one CLI archive, found ${#archive[@]}" >&2
            exit 1
          fi
          listing=$(unzip -l "${archive[0]}")
          for forbidden in compose skiko swing; do
            if grep -Eiq "$forbidden" <<< "$listing"; then
              echo "Standalone CLI archive contains forbidden desktop runtime: $forbidden" >&2
              exit 1
            fi
          done
          if ! grep -E 'daemonitor-cored$' <<< "$listing"; then
            echo "Standalone CLI archive missing daemonitor-cored binary" >&2
            exit 1
          fi
          echo "### Kotlin CLI (fallback)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive: ${archive[0]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Includes: daemonitor-cored (host arch)" >> "$GITHUB_STEP_SUMMARY"

      - name: Packaging shared-DB E2E smoke
        run: ./cored/scripts/packaging-shared-db-smoke.sh

      - name: Upload CLI archives
        uses: actions/upload-artifact@v4
        with:
          name: daemonitor-cli-${{ github.sha }}
          path: |
            build/native-cli/daemonitor-cli-*.zip
            cli/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            package_task: packageDeb
            package_glob: build/compose/binaries/main/deb/*.deb
            launcher: build/compose/binaries/main/app/Daemonitor/bin/Daemonitor
            app_path: build/compose/binaries/main/app/Daemonitor
          - os: windows-latest
            platform: windows
            package_task: packageMsi
            package_glob: build/compose/binaries/main/msi/*.msi
            launcher: build/compose/binaries/main/app/Daemonitor/Daemonitor.exe
            app_path: build/compose/binaries/main/app/Daemonitor
          - os: macos-latest
            platform: macos
            package_task: packageDmg
            package_glob: build/compose/binaries/main/dmg/*.dmg
            launcher: build/compose/binaries/main/app/Daemonitor.app/Contents/MacOS/Daemonitor
            app_path: build/compose/binaries/main/app/Daemonitor.app
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Use bash everywhere so `./gradlew` (the shell wrapper) runs uniformly, including on
        # Windows (Git Bash ships on the runner). Xvfb steps are still guarded to Linux only.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cored/go.mod
          cache-dependency-path: cored/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compose Desktop UI tests render via Skia/AWT, which needs a display. macOS and Windows
      # runners provide one; Linux is headless, so wrap the run in a virtual framebuffer.
      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew test --no-daemon --stacktrace

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build native application and installer
        run: ./gradlew createDistributable ${{ matrix.package_task }} --no-daemon --stacktrace

      - name: Smoke test packaged launcher
        run: |
          ./scripts/smoke-test-native-distribution.sh \
            "${{ matrix.launcher }}" \
            "${{ matrix.app_path }}"

      - name: Verify bundled daemonitor-cored in app resources
        run: |
          set -euo pipefail
          cored=$(find build/compose/binaries/main/app -type f \( -name 'daemonitor-cored' -o -name 'daemonitor-cored.exe' \) | head -1)
          if [[ -z "$cored" ]]; then
            echo "Packaged app missing daemonitor-cored under app/" >&2
            find build/compose/binaries/main/app -type f | head -80 >&2 || true
            exit 1
          fi
          case "$cored" in
            */resources/daemonitor-cored|*/resources/daemonitor-cored.exe) ;;
            *)
              echo "Bundled cored not under resources/: $cored" >&2
              exit 1
              ;;
          esac
          echo "Bundled cored: $cored"
          echo "- Desktop bundle includes daemonitor-cored" >> "$GITHUB_STEP_SUMMARY"

      - name: Read package version
        id: package-version
        run: echo "value=$(./gradlew -q printNativePackageVersion --no-daemon)" >> "$GITHUB_OUTPUT"

      - name: Verify native installer
        run: |
          shopt -s nullglob
          packages=(${{ matrix.package_glob }})
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one native installer, found ${#packages[@]}" >&2
            exit 1
          fi
          test -s "${packages[0]}"
          echo "### Native package" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: ${{ matrix.platform }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: ${packages[0]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native installer
        uses: actions/upload-artifact@v4
        with:
          name: Daemonitor-${{ steps.package-version.outputs.value }}-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.package_glob }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test
          if-no-files-found: ignore

  # Live JVM vs Go process honesty — Linux only (needs a real GRADLE_DAEMON + cored).
  # DualRunHonestyTest stays opt-in elsewhere (DAEMONITOR_DUAL_RUN=1); this job enables it.
  dual-run-honesty:
    name: Dual-run honesty (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cored/go.mod
          cache-dependency-path: cored/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run dual-run Linux honesty
        run: ./cored/scripts/dual-run-linux.sh

      - name: Summarize
        if: always()
        run: |
          echo "### Dual-run honesty (Linux)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Harness: \`cored/scripts/dual-run-linux.sh\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test: \`DualRunHonestyTest\` (\`DAEMONITOR_DUAL_RUN=1\`)" >> "$GITHUB_STEP_SUMMARY"

  cored:
    name: Go cored (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Match the JVM matrix: bash everywhere, including Windows (Git Bash).
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cored/go.mod
          cache-dependency-path: cored/go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test Go packages
        working-directory: cored
        run: go test ./...

      - name: Build binaries
        working-directory: cored
        run: |
          go build -o bin/daemonitor-cored ./cmd/daemonitor-cored
          go build -o bin/daemonitor-corectl ./cmd/daemonitor-corectl
          go build -o bin/daemonitor-cli ./cmd/daemonitor-cli

      - name: Native CLI PTY smoke
        if: runner.os != 'Windows'
        working-directory: cored
        run: ./scripts/pty-smoke.sh ./bin/daemonitor-cli

      - name: Native CLI redirected ps --json
        working-directory: cored
        run: |
          set -euo pipefail
          SOCK=$(mktemp -u "${TMPDIR:-/tmp}/daemonitor-json-XXXXXX.sock")
          DB=$(mktemp "${TMPDIR:-/tmp}/daemonitor-json-XXXXXX.db")
          ./bin/daemonitor-cored -socket "$SOCK" -db "$DB" -interval 200ms >/dev/null 2>&1 &
          CORED_PID=$!
          cleanup() {
            kill "$CORED_PID" 2>/dev/null || true
            wait "$CORED_PID" 2>/dev/null || true
            rm -f "$SOCK" "$DB" "${DB}-wal" "${DB}-shm"
          }
          trap cleanup EXIT
          for _ in $(seq 1 50); do
            [[ -S "$SOCK" ]] && break
            sleep 0.05
          done
          out=$(./bin/daemonitor-cli ps --json --socket "$SOCK" --no-autostart)
          python3 -c 'import json,sys; json.loads(sys.argv[1])' "$out"
          if printf '%s' "$out" | grep -q $'\x1b'; then
            echo "ANSI found in redirected JSON output" >&2
            exit 1
          fi

      - name: Cross-compile cored matrix
        if: runner.os == 'Linux'
        run: ./cored/scripts/cross-compile-cored.sh build/cored-cross

      - name: Cross-compile native CLI matrix
        if: runner.os == 'Linux'
        run: ./cored/scripts/cross-compile-cli.sh build/cli-cross

      - name: Upload cored cross artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: daemonitor-cored-cross-${{ github.sha }}
          path: build/cored-cross/*
          if-no-files-found: error
          retention-days: 7

      # Full bash smoke (Go client + JDK Unix socket client) on Unix runners.
      - name: Smoke Unix-socket IPC (Go + JVM clients)
        if: runner.os != 'Windows'
        working-directory: cored
        run: ./scripts/smoke.sh

      # Windows: AF_UNIX works in Go, but Git Bash path mapping breaks the shell smoke +
      # JDK client. The Go integration test above already covers IPC on this OS.
      - name: Confirm Windows IPC covered by Go tests
        if: runner.os == 'Windows'
        working-directory: cored
        run: go test ./internal/api -count=1 -v

      - name: Summarize
        if: always()
        working-directory: cored
        run: |
          echo "### Go cored" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Module: github.com/cdsap/daemonitor/cored" >> "$GITHUB_STEP_SUMMARY"
          go version >> "$GITHUB_STEP_SUMMARY"
