name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "icons/daemonitor.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp site/index.html site/styles.css site/app.js _site/
          cp site/assets/favicon.png site/assets/icon-192.png _site/assets/
          cp docs/images/live-monitor.png docs/images/process-visual.png docs/images/build-history.png _site/assets/
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/app.js
          test -f _site/assets/favicon.png
          test -f _site/assets/icon-192.png
          test -f _site/assets/live-monitor.png
          test -f _site/assets/process-visual.png
          test -f _site/assets/build-history.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
